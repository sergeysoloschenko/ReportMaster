services:
  backend:
    build:
      context: .
      dockerfile: webapp/backend/Dockerfile
    container_name: reportmaster-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./.codex:/root/.codex
    env_file:
      - .env
    environment:
      - CODEX_HOME=/root/.codex
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: webapp/frontend/Dockerfile
    container_name: reportmaster-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
